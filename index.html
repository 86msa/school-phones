<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>أرقام هواتف الطلاب</title>
<script>
// تطبيق الثيم المحفوظ قبل الرسم لتفادي الوميض
(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}})();
</script>
<style>
:root{
 --bg:#f3f5f9;--surface:#ffffff;--surface-2:#f7f8fb;--text:#18202b;--muted:#6b7686;--line:#e4e8ef;
 --accent:#2563eb;--accent-soft:#e8efff;--accent-text:#1d4fd7;
 --wa:#16a34a;--wa-soft:#e3f6ea;--warn:#b45309;--warn-soft:#fdf0dc;
 --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
 color-scheme:light;
}
:root[data-theme="dark"]{
 --bg:#0d1117;--surface:#161b24;--surface-2:#1c222d;--text:#e6ebf2;--muted:#8b97a8;--line:#262e3b;
 --accent:#5b9bff;--accent-soft:#18284a;--accent-text:#8db8ff;
 --wa:#3ddc84;--wa-soft:#12301f;--warn:#f2b45c;--warn-soft:#352711;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
 color-scheme:dark;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#0d1117;--surface:#161b24;--surface-2:#1c222d;--text:#e6ebf2;--muted:#8b97a8;--line:#262e3b;
  --accent:#5b9bff;--accent-soft:#18284a;--accent-text:#8db8ff;
  --wa:#3ddc84;--wa-soft:#12301f;--warn:#f2b45c;--warn-soft:#352711;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
 }
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5;transition:background .2s,color .2s}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- شاشة القفل ---------- */
[hidden]{display:none!important}
#lock{min-height:100vh;display:grid;place-items:center;padding:20px}
.lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.lock-card .logo{margin:0 auto 4px;width:52px;height:52px;border-radius:16px}
.lock-card h1{font-size:20px;margin:0}
.lock-card p{margin:0;color:var(--muted);font-size:14px}
.lock-card input[type=password]{height:48px;font:inherit;font-size:18px;text-align:center;letter-spacing:2px;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;outline:none}
.lock-card input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lock-card .rem{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
#unlock{height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
#unlock:disabled{opacity:.6;cursor:wait}
#lockErr{min-height:20px;color:var(--warn);font-size:14px}

/* ---------- الرأس ---------- */
.top{background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 16px 12px}
.bar{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
h1{font-size:20px;line-height:1.2;margin:0}
.stats{font-size:13px;color:var(--muted);margin-top:2px}
.stats b{color:var(--text);font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;transition:border-color .15s,background .15s}
.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.icon-btn span{font-size:14px}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]) .theme .sun{display:none}
 :root:not([data-theme="light"]) .theme .moon{display:block}
}

.search{position:relative;margin-top:12px}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:46px;font:inherit;font-size:16px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 44px 0 40px;outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.clear svg{position:static;transform:none;width:14px;height:14px}
.clear.on{display:grid}

.filters{display:flex;gap:8px;align-items:center;margin-top:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;transition:all .15s}
.pill small{color:var(--muted);margin-inline-start:6px;font-size:12px}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.on small{color:rgba(255,255,255,.8)}
.toggle{position:relative;flex:none;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;padding-inline-start:4px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked+.sw{background:var(--accent)}
.toggle input:checked+.sw::after{transform:translateX(-16px)}
.toggle input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- القائمة ---------- */
main{max-width:1120px;margin:0 auto;padding:16px 16px 56px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted);gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:8px}
.acts .icon-btn{height:36px;border-radius:10px;font-size:14px}
.group-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:15px;font-weight:600}
.group-h:first-child{margin-top:0}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.group-h small{color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;color:hsl(var(--h) 55% 32%);background:hsl(var(--h) 70% 92%)}
:root[data-theme="dark"] .av{color:hsl(var(--h) 80% 78%);background:hsl(var(--h) 35% 20%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{color:hsl(var(--h) 80% 78%);background:hsl(var(--h) 35% 20%)}}
.nm{min-width:0}
.nm b{display:block;font-size:16px;font-weight:600;line-height:1.35}
.nm span{font-size:13px;color:var(--muted)}
.phones{display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px}
.ph.bad{background:var(--warn-soft);border-color:transparent}
.who{font-size:12px;color:var(--muted);width:34px;flex:none}
.num{flex:1;font-size:16px;font-weight:600;direction:ltr;unicode-bidi:isolate;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.ph.bad .num{color:var(--warn)}
.warn-t{font-size:12px;color:var(--warn)}
.btns{display:flex;gap:4px}
.b{width:34px;height:34px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);text-decoration:none;transition:background .15s,color .15s}
.b:hover{background:var(--accent-soft);color:var(--accent-text)}
.b.wa{color:var(--wa)}
.b.wa:hover{background:var(--wa-soft);color:var(--wa)}
.b.call{color:var(--accent-text)}
.nophone{font-size:14px;color:var(--muted);text-align:center;padding:8px;border:1px dashed var(--line);border-radius:12px}
.empty{padding:56px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.empty svg{width:36px;height:36px;margin-bottom:8px;opacity:.6}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
 .icon-btn span{display:none}
 .icon-btn{padding:0;width:40px;justify-content:center}
 .acts .icon-btn{width:auto;padding:0 12px}
 .acts .icon-btn span{display:inline}
 .top{position:static}
 .b{width:42px;height:42px}
 .num{font-size:17px}
 .filters{flex-wrap:wrap}
 .chips{flex-basis:100%}
 .grid{grid-template-columns:1fr}
 h1{font-size:18px}
}
@media print{
 :root:root:root{--bg:#fff;--surface:#fff;--surface-2:#fff;--text:#000;--muted:#444;--line:#bbb;--shadow:none;--accent-soft:#eee;--warn:#8a4b00;--warn-soft:#fff;--wa:#000;--accent-text:#000}
 .av{color:#000!important;background:#eee!important}
 .top,.acts,#toast,.btns{display:none}
 body{background:#fff}
 main{padding:0}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px}
 .card{break-inside:avoid;box-shadow:none;padding:8px}
 .av{display:none}
 .group-h{break-after:avoid}
}
</style>
</head>
<body>
<div id="lock">
 <form id="lockForm" class="lock-card" autocomplete="off">
  <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>أرقام هواتف الطلاب</h1>
  <p>أدخل كلمة السر للدخول</p>
  <input id="pw" type="password" placeholder="كلمة السر" autocapitalize="characters" spellcheck="false" aria-label="كلمة السر" dir="ltr">
  <label class="rem"><input id="remember" type="checkbox"> تذكّرني على هذا الجهاز</label>
  <button id="unlock" type="submit">دخول</button>
  <div id="lockErr" role="alert"></div>
 </form>
</div>
<div id="app" hidden>
<header class="top"><div class="top-in">
 <div class="bar">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
  <div class="ttl"><h1>أرقام هواتف الطلاب</h1><div class="stats" id="stats"></div></div>
  <button class="icon-btn theme" id="theme" type="button" aria-label="تبديل الوضع الليلي" title="تبديل الوضع الليلي">
   <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
   <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   <span id="themeLbl">ليلي</span>
  </button>
 </div>
 <div class="search">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="ابحث باسم الطالب أو رقم الهاتف…" autocomplete="off" aria-label="بحث">
  <button class="clear" id="clear" type="button" aria-label="مسح"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
 </div>
 <div class="filters">
  <div class="chips" id="chips" role="group" aria-label="الصف"></div>
  <label class="toggle"><input id="hasPhone" type="checkbox"><span class="sw"></span>لديهم رقم فقط</label>
  <label class="toggle"><input id="badOnly" type="checkbox"><span class="sw"></span>أرقام تحتاج تصحيح</label>
 </div>
</div></header>

<main>
 <div class="meta"><div id="count"></div>
  <div class="acts">
   <button class="icon-btn" id="csv" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>تصدير CSV</span></button>
   <button class="icon-btn" id="print" type="button"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg><span>طباعة</span></button>
  </div>
 </div>
 <div id="out"></div>
</main>
</div>
<div id="toast" role="status"></div>

<script>
function boot(RAW){
const ORDER = ["الاول الابتدائي","الثاني الابتدائي","الثالث الابتدائي","الرابع الابتدائي","الخامس الابتدائي","السادس الابتدائي"];
const HUE = {"الاول الابتدائي":210,"الثاني الابتدائي":160,"الثالث الابتدائي":35,"الرابع الابتدائي":280,"الخامس الابتدائي":340,"السادس الابتدائي":190};
const short = c=>c.replace(" الابتدائي","");

// تطبيع الرقم العراقي إلى 07XXXXXXXXX
function norm(raw){
  let d=(raw||"").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g,"");
  if(!d) return null;
  if(d.startsWith("00964")) d="0"+d.slice(5);
  else if(d.startsWith("964")) d="0"+d.slice(3);
  else if(d.length===10 && d[0]==="7") d="0"+d;
  return {num:d, ok:/^07\d{9}$/.test(d)};
}
const students = RAW.filter(s=>!s.deleted).map(s=>({
  name:s.name, cls:s.cls,
  phones:[["الأب",s.father],["الأم",s.mother]].map(([t,v])=>{const n=norm(v);return n&&{tag:t,...n}}).filter(Boolean)
})).sort((a,b)=>(ORDER.indexOf(a.cls)-ORDER.indexOf(b.cls))||a.name.localeCompare(b.name,"ar"));

const $=id=>document.getElementById(id);
const q=$("q"),out=$("out"),count=$("count"),chips=$("chips"),has=$("hasPhone"),badOnly=$("badOnly"),clearBtn=$("clear");
let cls="", shown=[];

// توحيد الحروف للبحث: أ إ آ ← ا، ى ← ي، ة ← ه، وإزالة التشكيل والتطويل
const fold=s=>s.replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase();
students.forEach(s=>s.key=fold(s.name));

const withPhone=students.filter(s=>s.phones.some(p=>p.ok)).length;
const badCount=students.reduce((n,s)=>n+s.phones.filter(p=>!p.ok).length,0);
$("stats").innerHTML=`<b>${students.length}</b> طالب · <b>${withPhone}</b> رقم صالح`+(badCount?` · <b>${badCount}</b> للتصحيح`:"");
const cnt=n=>n===1?"رقم واحد":n===2?"رقمان":n+" أرقام";
const why=p=>p.num.length<11?`ينقصه ${cnt(11-p.num.length)}`:p.num.length>11?`زائد ${cnt(p.num.length-11)}`:"لا يبدأ بـ 07";

const classes=ORDER.filter(c=>students.some(s=>s.cls===c));
function drawChips(){
  const n=c=>students.filter(s=>!c||s.cls===c).length;
  chips.innerHTML=[["","الكل"],...classes.map(c=>[c,short(c)])].map(([c,l])=>
    `<button class="pill${cls===c?" on":""}" type="button" aria-pressed="${cls===c}" data-c="${c}">${l}<small>${n(c)}</small></button>`).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;cls=b.dataset.c;drawChips();render()});

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digits=s=>s.replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
const I={
 call:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
 wa:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></svg>',
 copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
 none:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>'
};
function card(s){
  const h=HUE[s.cls]??210;
  const phones=s.phones.length?s.phones.map(p=>`<div class="ph${p.ok?"":" bad"}"><span class="who">${p.tag}</span><span class="num">${esc(p.num)}</span>`+
    (p.ok?`<span class="btns"><a class="b call" href="tel:${p.num}" title="اتصال" aria-label="اتصال بـ ${p.tag}">${I.call}</a><a class="b wa" href="https://wa.me/964${p.num.slice(1)}" target="_blank" rel="noopener" title="واتساب" aria-label="واتساب ${p.tag}">${I.wa}</a><button class="b" type="button" data-copy="${p.num}" title="نسخ" aria-label="نسخ رقم ${p.tag}">${I.copy}</button></span>`
      :`<span class="warn-t" title="رقم غير صحيح">${why(p)}</span><span class="btns"><button class="b" type="button" data-copy="${p.num}" title="نسخ" aria-label="نسخ">${I.copy}</button></span>`)+`</div>`).join("")
    :'<div class="nophone">لا يوجد رقم مسجّل</div>';
  return `<article class="card"><div class="head"><div class="av" style="--h:${h}">${esc(s.name.trim()[0]||"?")}</div><div class="nm"><b>${esc(s.name)}</b><span>${short(s.cls)}</span></div></div><div class="phones">${phones}</div></article>`;
}
function render(){
  const raw=digits(q.value.trim());
  const words=fold(raw).split(/\s+/).filter(Boolean);
  const digitsOnly=raw.replace(/\D/g,"");
  clearBtn.classList.toggle("on",!!q.value);
  shown=students.filter(s=>
    (!cls||s.cls===cls)&&(!has.checked||s.phones.length)&&(!badOnly.checked||s.phones.some(p=>!p.ok))&&
    (!words.length||words.every(w=>s.key.includes(w))||(digitsOnly.length>=3&&s.phones.some(p=>p.num.includes(digitsOnly)))));
  count.textContent=`يعرض ${shown.length} من ${students.length} طالب`;
  if(!shown.length){out.innerHTML=`<div class="empty">${I.none}<div>لا توجد نتائج مطابقة</div></div>`;return}
  let html="",last=null;
  const grouped=!cls;
  for(const s of shown){
    if(grouped&&s.cls!==last){
      if(last!==null)html+="</div>";
      html+=`<div class="group-h">${esc(s.cls)} <small>(${shown.filter(x=>x.cls===s.cls).length})</small></div><div class="grid">`;
      last=s.cls;
    }else if(!grouped&&last===null){html+='<div class="grid">';last=s.cls}
    html+=card(s);
  }
  out.innerHTML=html+"</div>";
}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1500)}
out.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");if(!b)return;
  const v=b.dataset.copy;
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("تم نسخ "+v),()=>{
    const t=document.createElement("textarea");t.value=v;document.body.append(t);t.select();
    try{document.execCommand("copy");toast("تم نسخ "+v)}catch(_){toast("تعذر النسخ")}t.remove();
  });
});
let tmr;q.addEventListener("input",()=>{clearTimeout(tmr);tmr=setTimeout(render,80)});
has.addEventListener("input",render);badOnly.addEventListener("input",render);
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";render()}});
clearBtn.onclick=()=>{q.value="";render();q.focus()};
$("print").onclick=()=>print();
$("csv").onclick=()=>{
  const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const get=(s,t)=>(s.phones.find(p=>p.tag===t)||{}).num||"";
  const rows=[["الاسم","الصف","هاتف الأب","هاتف الأم"]].concat(shown.map(s=>[s.name,s.cls,get(s,"الأب"),get(s,"الأم")]));
  const body=rows.map((r,i)=>r.map((v,j)=>i&&j>1&&v?'"=""'+v+'"""':cell(v)).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+body],{type:"text/csv;charset=utf-8"}));
  a.download="ارقام-الطلاب.csv";a.click();URL.revokeObjectURL(a.href);
};

const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)");
const isDark=()=>root.dataset.theme?root.dataset.theme==="dark":mq.matches;
function syncLbl(){$("themeLbl").textContent=isDark()?"نهاري":"ليلي"}
$("theme").onclick=()=>{
  const next=isDark()?"light":"dark";
  root.dataset.theme=next;
  try{localStorage.setItem("theme",next)}catch(e){}
  syncLbl();
};
mq.addEventListener("change",syncLbl);
syncLbl();

drawChips();render();

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPw=s=>s.replace(/[\s\-]/g,"").toUpperCase();
async function decrypt(pw){
  const all=b64(ENC),salt=all.slice(0,16),iv=all.slice(16,28),ct=all.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(normPw(pw)),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));
}
(function(){
  const lock=document.getElementById("lock"),app=document.getElementById("app"),form=document.getElementById("lockForm"),
        pw=document.getElementById("pw"),err=document.getElementById("lockErr"),rem=document.getElementById("remember"),btn=document.getElementById("unlock");
  async function open(p,silent){
    btn.disabled=true;err.textContent="";
    try{
      const data=await decrypt(p);
      if(rem.checked){try{localStorage.setItem("pw",p)}catch(e){}}
      lock.hidden=true;app.hidden=false;boot(data);
    }catch(e){
      btn.disabled=false;
      if(!silent){err.textContent=window.crypto&&crypto.subtle?"كلمة السر غير صحيحة":"هذا المتصفح لا يدعم فك التشفير على هذا الرابط";pw.select()}
      else{try{localStorage.removeItem("pw")}catch(_){}}
    }
  }
  form.addEventListener("submit",e=>{e.preventDefault();if(pw.value.trim())open(pw.value,false)});
  let saved=null;try{saved=localStorage.getItem("pw")}catch(e){}
  if(saved&&window.crypto&&crypto.subtle){rem.checked=true;open(saved,true)}
  pw.focus();
})();
</script>
